<!doctype html>
<!-- ui.html — the whole front end. It calls ONLY /api/summarise on our own server:
     the browser never sees the AI key or the provider's URL. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Summariser</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 720px; margin: 2rem auto;
           padding: 0 1rem; color: #1b2838; }
    textarea { width: 100%; min-height: 10rem; font: inherit; }
    button { margin-top: .6rem; padding: .4rem 1rem; }
    #out { margin-top: 1rem; padding: .8rem 1rem; border-radius: 6px; white-space: pre-wrap; }
    .ok { background: #eef6f0; }
    .error { background: #fdeeea; color: #8a2a12; }
    small { color: #5b6878; }
  </style>
</head>
<body>
  <h1>AI Summariser</h1>
  <p><small>Paste any text (up to 8000 characters). The summary is generated by AI.</small></p>
  <textarea id="text" maxlength="8000"
            placeholder="Paste a long text here…"></textarea>
  <button id="go">Summarise</button>
  <div id="out"></div>

<script>
const go = document.getElementById("go");
const out = document.getElementById("out");

go.onclick = async () => {
  const text = document.getElementById("text").value.trim();
  if (!text) { out.className = "error"; out.textContent = "Please paste some text first."; return; }
  go.disabled = true;                              // one click = one request
  out.className = ""; out.textContent = "Summarising…";
  try {
    const r = await fetch("/api/summarise", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ text }),
      signal: AbortSignal.timeout(30000),          // never a spinner forever
    });
    const data = await r.json();
    out.className = r.ok ? "ok" : "error";
    out.textContent = r.ok ? data.summary : (data.message || "Something went wrong.");
  } catch (e) {
    out.className = "error";
    out.textContent = "The AI feature is unavailable right now. Please try again in a minute.";
  } finally {
    go.disabled = false;
  }
};
</script>
</body>
</html>
